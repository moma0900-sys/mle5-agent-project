[project]
name = "mle-agent-project"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "pydantic-ai[groq,mistral,openrouter]>=2.60.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "qdrant-client>=1.20.0",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["solution/tests"]
pythonpath = ["."]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
